<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATHFLOW 검수 대시보드</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>PATHFLOW 콘텐츠 검수</h1>
          <p class="subtitle">
            AI가 생성한 수업을 검토하고 승인하여 학습 경험의 신뢰도를
            유지하세요.
          </p>
        </div>
        <div class="header-meta">
          <span class="pill">RAG 모니터링</span>
          <span class="pill">인간 검증 필수</span>
        </div>
      </header>

      <nav class="status-tabs" aria-label="검수 상태 선택">
        <button
          type="button"
          class="status-tab status-tab--active"
          data-status="pending"
        >
          검토 대기
          <span class="status-count" data-count-status="pending">0</span>
        </button>
        <button type="button" class="status-tab" data-status="approved">
          승인 완료
          <span class="status-count" data-count-status="approved">0</span>
        </button>
        <button
          type="button"
          class="status-tab"
          data-status="revision_requested"
        >
          수정 요청됨
          <span class="status-count" data-count-status="revision_requested"
            >0</span
          >
        </button>
        <button type="button" class="status-tab" data-status="rejected">
          거부됨
          <span class="status-count" data-count-status="rejected">0</span>
        </button>
      </nav>

      <main class="main-content">
        <aside class="filters-panel">
          <section class="filters">
            <div class="filter-group">
              <label for="filter-cefr">CEFR 수준</label>
              <select id="filter-cefr">
                <option value="all">전체</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="B1">B1</option>
                <option value="B2">B2</option>
                <option value="C1">C1</option>
                <option value="C2">C2</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filter-theme">테마</label>
              <select id="filter-theme">
                <option value="all">전체</option>
                <option value="business">Business</option>
                <option value="tech_Coding">Tech &amp; Coding</option>
                <option value="everyday_life">Everyday Life</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filter-lesson-type">레슨 타입</label>
              <select id="filter-lesson-type">
                <option value="all">전체</option>
                <option value="1">1 - 개념 설명</option>
                <option value="2">2 - 롤 플레이</option>
                <option value="3">3 - 기타</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filter-grammar">문법 포커스</label>
              <input
                type="search"
                id="filter-grammar"
                placeholder="예: conditional, tense"
              />
            </div>
            <button class="reset-btn" id="filters-reset" type="button">
              필터 초기화
            </button>
          </section>
        </aside>

        <section class="lesson-area">
          <section class="lesson-list" id="lesson-list" aria-live="polite">
            <!-- Lessons populated by app.js -->
          </section>
        </section>
      </main>
    </div>

    <dialog id="lesson-dialog">
      <form method="dialog" class="dialog-content">
        <header class="dialog-header">
          <div>
            <h2 id="dialog-title"></h2>
            <p id="dialog-subtitle"></p>
          </div>
          <button class="dialog-close" value="close" aria-label="닫기">
            ×
          </button>
        </header>

        <section class="dialog-body">
          <div class="dialog-section">
            <h3>핵심 태그</h3>
            <div class="tag-grid" id="dialog-tags"></div>
          </div>
          <div class="dialog-section">
            <h3>수업 개요</h3>
            <p id="dialog-summary"></p>
          </div>
          <div class="dialog-section">
            <h3>AI 제안 콘텐츠</h3>
            <div class="dialog-content-block" id="dialog-content"></div>
          </div>
          <div class="dialog-section" id="dialog-flags-wrapper">
            <h3>리스크 신호</h3>
            <ul id="dialog-flags"></ul>
          </div>
          <div class="dialog-section">
            <h3>검수 메모</h3>
            <textarea
              id="dialog-notes"
              rows="4"
              placeholder="승인/반려 사유 또는 수정 요청사항을 남겨주세요."
            ></textarea>
          </div>
        </section>

        <footer class="dialog-footer">
          <button
            type="submit"
            class="btn-secondary"
            value="revision_requested"
          >
            수정 요청
          </button>
          <button type="submit" class="btn-danger" value="rejected">
            반려
          </button>
          <button type="submit" class="btn-primary" value="approved">
            승인
          </button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
